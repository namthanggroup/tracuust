<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Thông báo chuyển máy chủ - An Giang</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: linear-gradient(135deg, #d9fdd3, #f9f9f9);
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
      padding: 30px 20px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
      animation: fadeIn 0.8s ease forwards;
    }

    .logo {
      width: 120px;
      height: auto;
      margin-bottom: 20px;
      animation: fadeInDown 1s ease forwards;
    }

    h2 {
      color: #216b36;
      font-size: 23px;
      line-height: 1.4;
      margin: 0 0 20px;
    }

    .message {
      color: #444;
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    .message strong {
      color: #d63031;
    }

    .link {
      color: #087f23;
      font-weight: bold;
      word-break: break-word;
    }

    .contact {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid #ddd;
      color: #555;
      font-size: 16px;
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      width: 90%;
      max-width: 320px;
      padding: 16px 20px;
      background-color: #28a745;
      color: white;
      font-size: 19px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
    }

    .button:hover {
      background-color: #218838;
      transform: scale(1.03);
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @media (max-width: 480px) {
      h2 {
        font-size: 20px;
      }

      .message {
        font-size: 17px;
      }

      .container {
        padding: 25px 15px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <img src="logo.png" alt="Logo Nam Thắng" class="logo">

    <h2>THÔNG BÁO CHUYỂN MÁY CHỦ<br>DÙNG MỘT LINK CHUNG</h2>

    <div class="message">
      <strong>Ngày 07/09/2026, Máy chủ 1 đã đóng lại.</strong>
      <br><br>

      Anh/Chị/Em vui lòng truy cập và lưu link dùng chung:
      <br>

      <span class="link">tracuu.taxinamthang.vn</span>

      <div class="contact">
        Mọi thắc mắc liên quan đến App, vui lòng liên hệ
        <strong>IT hoặc Checker</strong>.
      </div>
    </div>

    <a
      href="https://tracuu.taxinamthang.vn"
      class="button"
    >
      Truy cập App tra cứu
    </a>

  </main>
</body>
</html>
